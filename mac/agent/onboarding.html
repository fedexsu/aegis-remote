<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HatchConnect</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e8ec;
                 font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Display", Segoe UI, sans-serif; }
    .wrap { padding: 24px 26px; height: 100%; display: flex; flex-direction: column; gap: 18px; }
    h1   { margin: 0; font-size: 18px; font-weight: 600; }
    .sub { color: #8a90a0; font-size: 13px; line-height: 1.45; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
           background: #1b1f28; border: 1px solid #262c3a; border-radius: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4a5060; flex: 0 0 auto; }
    .dot.on { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,.18); }
    .name { font-weight: 500; flex: 1; }
    button { appearance: none; border: 0; padding: 8px 14px; border-radius: 8px;
             background: #2f6bff; color: #fff; font: inherit; font-weight: 500;
             cursor: pointer; }
    button.secondary { background: #262c3a; color: #cfd3dc; }
    button:hover { filter: brightness(1.08); }
    .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .hint { color: #6b7080; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Let a technician help you</h1>
      <div class="sub">Grant these two permissions and your technician will be able to view and control your Mac. Takes about 30&nbsp;seconds.</div>
    </div>

    <div class="row">
      <div class="dot" id="dot-screen"></div>
      <div class="name">Screen Recording</div>
      <button onclick="window.agent.openSettings('screen')">Grant</button>
    </div>

    <div class="row">
      <div class="dot" id="dot-accessibility"></div>
      <div class="name">Accessibility</div>
      <button onclick="window.agent.openSettings('accessibility')">Grant</button>
    </div>

    <div class="foot">
      <div class="hint">You can close this window — the agent keeps running in the background.</div>
      <button class="secondary" onclick="window.agent.quit()">Quit</button>
    </div>
  </div>
  <script>
    // Phase 2 will wire live permission-check polling here. For now the dots
    // stay grey until real CGPreflightScreenCaptureAccess / AXIsProcessTrusted
    // wiring lands in the native helper.
  </script>
</body>
</html>
